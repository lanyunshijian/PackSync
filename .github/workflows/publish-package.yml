name: Publish Package

# 构建并把 jar 发布到 GitHub Packages（Maven registry）：
# https://github.com/lanyunshijian/PackSync/packages
#
# 触发方式：推送到 main，或在 Actions 页面手动 Run workflow。

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and publish
        run: ./gradlew build publish --no-daemon --console=plain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Upload jar as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: packsync-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
