# =============================================================================
# PackSync — 自托管整合包自动同步模组
#
# 本机只有 3.8 GB 内存：关闭 Gradle 守护进程并限制堆，避免 OOM。
# =============================================================================
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false

## Environment Properties
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.3.0
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## Mod Properties
mod_id=packsync
mod_name=PackSync
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.dsh.packsync
# 作者：蓝韵诗笺
# 必须写成 \uXXXX 转义：Gradle 以 ISO-8859-1 读取 gradle.properties，
# 直接写中文会在 mods.toml 里被二次编码成乱码（实测）。
mod_authors=\u84DD\u97F5\u8BD7\u7B3A
mod_description=A self-hosted modpack synchronization mod: the server publishes a pack, clients download it automatically before the game loads. Verification keys are generated under <server root>/modpack-keys/.
